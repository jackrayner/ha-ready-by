set_ready_by:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ready_by
    ready_by:
      required: true
      example: "2026-11-23 19:00:00"
      selector:
        datetime:
    target:
      required: false
      example: 38
      selector:
        number:
          min: 10
          max: 45
          step: 0.5
          unit_of_measurement: "°C"
set_daily:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ready_by
    time:
      required: false
      example: "07:00:00"
      selector:
        time:
    enabled:
      required: false
      selector:
        boolean:
    off_at_ready_by:
      required: false
      selector:
        boolean:
    target:
      required: false
      example: 38
      selector:
        number:
          min: 10
          max: 45
          step: 0.5
          unit_of_measurement: "°C"
import_sessions:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ready_by
    sessions:
      required: false
      selector:
        object:
    cooling:
      required: false
      selector:
        object:
reset_model:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: ready_by
